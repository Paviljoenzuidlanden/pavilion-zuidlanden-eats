name: Deploy to FTP

on:
  push:
    branches:
      - main

# Prevent concurrent deployments to FTP
concurrency:
  group: production-ftp
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔨 Build project
        run: bun run build

      - name: ⚙️ Prepare FTP parameters
        env:
          INPUT_SERVER: ${{ secrets.FTP_SERVER }}
          INPUT_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          SRV="$(echo "${INPUT_SERVER}" | sed -e 's|^[^/]*://||' -e 's|/$||' | xargs)"
          echo "FTP_SERVER_CLEAN=${SRV}" >> "$GITHUB_ENV"

          DIR="$(echo "${INPUT_DIR}" | xargs)"
          DIR="${DIR:-public_html/}"
          [[ "$DIR" != */ ]] && DIR="${DIR}/"
          echo "FTP_DIR_CLEAN=${DIR}" >> "$GITHUB_ENV"

      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_CLEAN }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_DIR_CLEAN }}
          local-dir: ./dist/
