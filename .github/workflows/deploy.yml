name: Deploy to FTP

on:
  push:
    branches:
      - main

# Prevent concurrent deployments to FTP
concurrency:
  group: production-ftp
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔨 Build project
        run: bun run build

      - name: ⚙️ Prepare FTP parameters
        env:
          INPUT_SERVER: ${{ secrets.FTP_SERVER }}
          INPUT_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 -c '
          import os, re, socket

          raw_server = os.environ.get("INPUT_SERVER", "").strip().strip("\"'\''")
          # Strip protocol if present
          s = re.sub(r"^[a-zA-Z]+://", "", raw_server)
          # If user@host was entered, extract host
          if "@" in s:
              s = s.split("@")[-1]
          # Strip any path
          s = s.split("/")[0]

          port = "21"
          if ":" in s:
              parts = s.split(":")
              s = parts[0]
              port = parts[1]

          resolved = False
          if s:
              try:
                  ip = socket.gethostbyname(s)
                  print(f"Server host resolved in DNS: {ip}")
                  resolved = True
              except Exception as e:
                  print(f"Could not resolve provided server host in DNS: {e}")

          if not resolved:
              print("Using fallback host for paviljoenzuidlanden.nl: 213.154.231.202")
              s = "213.154.231.202"

          raw_dir = os.environ.get("INPUT_DIR", "").strip().strip("\"'\''")
          if not raw_dir:
              raw_dir = "public_html/"
          if not raw_dir.endswith("/"):
              raw_dir += "/"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FTP_SERVER_CLEAN={s}\n")
              f.write(f"FTP_PORT_CLEAN={port}\n")
              f.write(f"FTP_DIR_CLEAN={raw_dir}\n")
          '

      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_CLEAN }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_CLEAN }}
          protocol: ftps
          security: loose
          server-dir: ${{ env.FTP_DIR_CLEAN }}
          local-dir: ./dist/
